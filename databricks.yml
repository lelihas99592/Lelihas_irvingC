bundle:
  name: lelihas_irvingc_bundle

include:
  - resources/**/*.yml

targets:
  dev:
    default: true
    workspace:
      host: ${env.DATABRICKS_HOST_DEV}
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    workspace:
      host: ${env.DATABRICKS_HOST_PROD}
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
